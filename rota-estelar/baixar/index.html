<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baixar o Rota Estelar</title>
<meta name="description" content="Baixe o Rota Estelar na App Store.">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://arialgamer.com.br/rota-estelar/">
<meta property="og:title" content="Rota Estelar: Jogo de Nave">
<meta property="og:description" content="Pilote sua nave, desvie e destrua os inimigos. Baixe na App Store.">
<meta property="og:image" content="https://arialgamer.com.br/media/rota-chefe.jpg">
<link rel="icon" href="/favicon.png">
<script>
// Abre direto a loja do celular; no computador, mostra os botões e o QR code.
(function () {
  var ua = navigator.userAgent;
  if (/iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) location.replace('https://apps.apple.com/' + (/^pt/i.test(navigator.language || '') ? 'br/' : '') + 'app/id6833923100');
  else if (/Android/.test(ua)) location.replace('https://play.google.com/store/apps/details?id=com.arial.rotaestelar');
})();
</script>
<style>
:root { color-scheme: dark }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0d0a20; color: #fff; font: 17px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center; padding: 24px 16px; box-sizing: border-box }
main { max-width: 420px }
img.icone { width: 96px; height: 96px; border-radius: 22px }
h1 { font-size: 26px; margin: 14px 0 4px }
p { margin: 0 0 22px; color: #c9c3e6 }
.loja { display: block; margin: 10px 0; padding: 14px 18px; border-radius: 14px; background: #fff; color: #111; font-weight: 700; text-decoration: none }
.breve { background: transparent; color: #aab; border: 1px dashed #556 }
img.qr { width: 180px; height: 180px; margin-top: 18px; border-radius: 12px; background: #fff; padding: 8px }
small { display: block; color: #9aa5b1; margin-top: 6px }
small a { color: #fff }
</style>
</head>
<body>
<main>
  <img class="icone" src="/rota.png" alt="">
  <h1>Rota Estelar</h1>
  <p>Pilote sua nave, desvie e destrua os inimigos 🚀</p>
  <a class="loja" href="https://apps.apple.com/br/app/id6833923100">App Store</a>
  <a class="loja" href="https://play.google.com/store/apps/details?id=com.arial.rotaestelar">Google Play</a>
  <img class="qr" src="/rota-estelar/baixar/qr.png" alt="QR code para baixar o Rota Estelar">
  <small>Aponte a câmera do celular · Point your phone camera</small>
  <small><a href="/rota-estelar/">Conheça o Rota Estelar →</a></small>
</main>
<script data-pais-loja>if (!/^pt/i.test(navigator.language || '')) document.querySelectorAll('a[href*="apps.apple.com/br/"]').forEach(function (a) { a.href = a.href.replace('apps.apple.com/br/', 'apps.apple.com/'); });</script>
</body>
</html>
