<script>
// Abre direto a loja do celular; no computador, mostra os botões e o QR code.
(function () {

  if (/iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) location.replace('https://apps.apple.com/app/id6819893974');

})();
